<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:#080810;font-family:'DM Sans',system-ui,sans-serif;padding:22px 16px 60px}
  #cx-wrap{max-width:1100px;margin:0 auto}
  #cx-root{margin-bottom:0}
  #cx-rodape{max-width:1100px;margin:14px auto 0;text-align:center;font-size:10.5px;letter-spacing:.08em;color:#4e545c;text-transform:uppercase}
  #cx-rodape a{color:inherit}
  #toast-wrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
  .toast{background:#1a1a24;border:1px solid #2a2a38;color:#eee;padding:8px 16px;border-radius:99px;font-size:12px;opacity:0;transition:opacity .25s}
  .toast.show{opacity:1}
  .toast.err{border-color:#f87171;color:#f87171}
</style>

<body>

<script>
  // página só de exibição (sem login): nunca vira admin, nem sem querer
  window.__cxAdmin = false;
  const SB_URL = 'https://defwtvwmxntoliuwzjnf.supabase.co';
  const SB_KEY = 'sb_publishable_QukddDQPhm3R3XaUlxIY6w_7qleuNL8';
  const sb = supabase.createClient(SB_URL, SB_KEY);
  function toast(msg, tipo){
    const w = document.getElementById('toast-wrap'); if(!w) return;
    const d = document.createElement('div'); d.className = 'toast show ' + (tipo === 'err' ? 'err' : '');
    d.textContent = msg; w.appendChild(d);
    setTimeout(() => { d.style.opacity = '0'; setTimeout(() => d.remove(), 300); }, 3400);
  }
